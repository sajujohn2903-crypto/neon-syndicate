name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # image ships the Android SDK (ANDROID_HOME)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk neon-syndicate.apk

      - name: Point the apk-latest tag at this commit
        run: |
          git tag -f apk-latest
          git push -f origin refs/tags/apk-latest

      - name: Publish to the "Android app" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Neon Syndicate — Android app
          make_latest: true
          files: neon-syndicate.apk
          body: |
            Install on the projector: open the Downloader app and enter
            https://github.com/sajujohn2903-crypto/neon-syndicate/releases/latest/download/neon-syndicate.apk
            The app loads the live game, so game updates appear without reinstalling.
